# Spark Reporter Configuration
extent.reporter.spark.start=true
extent.reporter.spark.out=test-output/ExtentReports/SparkReport.html
extent.reporter.spark.config=src/test/resources/extent-config.xml
extent.reporter.spark.vieworder=dashboard,test,category,exception,log

# Screenshot Configuration
screenshot.dir=test-output/screenshots/
screenshot.rel.path=../screenshots/

# PDF Reporter (Optional)
extent.reporter.pdf.start=false
extent.reporter.pdf.out=test-output/ExtentReports/ExtentPdf.pdf

# System Information
systeminfo.Application=Amazon E-Commerce
systeminfo.Module=Add to Cart
systeminfo.Environment=QA
systeminfo.Build=1.0.0